workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  ios-workflow:
      name: iOS Workflow
      max_build_duration: 120
      environment:
        flutter: stable
        xcode: latest
        cocoapods: default
      scripts:
        - name: Get packages
          script: flutter pub get
        - name: Install pods
          script: |
            cd ios
            pod install
        - name: Analyze
          script: flutter analyze
        - name: Run tests
          script: flutter test
        - name: Build iOS
          script: |
            flutter build ios --release --no-codesign
      artifacts:
        - build/ios/iphoneos/*.app